name: Build & Push Build Base Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.build-base'
      - '.github/workflows/build-base.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || vars.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Build Base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.build-base
          push: true
          tags: ${{ secrets.DOCKER_USERNAME || vars.DOCKERHUB_USERNAME }}/popcorn-build-base:latest
