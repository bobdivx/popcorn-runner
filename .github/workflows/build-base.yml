name: Build & Push Build Base Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.build-base'
      - '.github/workflows/build-base.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Build Base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.build-base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/popcorn-build-base:latest
